name: TradeOS v6 — Morning Pre-Market Cues

# Timing sequence:
#   08:00 AM IST (2:30 UTC)  — global cues + morning brief
#   08:30 AM IST (3:00 UTC)  — kite_token_refresh (manual step — see note)
#   08:45 AM IST (3:15 UTC)  — kite_reconcile + position risk scan
#
# Note on kite_token_refresh: Kite requires a manual browser login once daily
# to generate the access token. This cannot be automated via GitHub Actions.
# Run it manually from your local machine at 8:30 AM before market open:
#   python backend/kite/kite_token_refresh.py
# Then copy KITE_ACCESS_TOKEN into GitHub Secrets for the day.

on:
  schedule:
    - cron: '30 1 * * 1-5'    # 7:00 AM IST (1:30 UTC) — global cues
    - cron: '15 3 * * 1-5'    # 8:45 AM IST (3:15 UTC) — reconcile + risk scan
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (cues | reconcile | all)'
        required: false
        default: 'all'

jobs:
  # ── JOB 1: Morning global cues + Telegram brief (7:00 AM) ──────────────────
  morning-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * 1-5'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create credentials file
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p backend/credentials
          echo "$GOOGLE_CREDS" > backend/credentials/service_account.json

      - name: Fetch morning global cues
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python ingestion/ingest_global_cues.py MORNING

      - name: Send morning Telegram brief
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python alerts/send_alerts.py --morning

  # ── JOB 2: Kite reconciliation + position risk scan (8:45 AM) ──────────────
  # Runs after kite_token_refresh.py has been run manually at 8:30 AM.
  # Requires KITE_API_KEY and KITE_ACCESS_TOKEN in GitHub Secrets.
  # If Kite token is not yet set, kite_reconcile exits with "kite_unavailable"
  # warning — non-fatal, no pipeline failure.
  kite-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * 1-5'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Kite position reconciliation
        working-directory: backend
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          KITE_API_KEY:           ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:      ${{ secrets.KITE_ACCESS_TOKEN }}
          TZ: Asia/Kolkata
        run: python kite/kite_reconcile.py
        continue-on-error: true     # stale token shouldn't fail the whole morning

      - name: Morning position risk scan
        working-directory: backend
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python alerts/send_alerts.py --position-risk
        continue-on-error: true
