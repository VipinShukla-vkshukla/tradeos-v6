name: TradeOS v6 Weekly Evolution (ML Training + Rule Proposals)

on:
  schedule:
    - cron: '30 3 * * 0'  # Sunday 9:00 AM IST (3:30 UTC)
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r backend/requirements.txt

      - name: Create credentials file
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p backend/credentials
          echo "$GOOGLE_CREDS" > backend/credentials/service_account.json

      - name: Train ML conviction model (all phases)
        # Trains RandomForest on signal_log outcomes — needs 30+ closed trades.
        # CC5: now uses 19 features (12 original + 7 new Phase 2 context fields).
        # New features default to neutral values for Phase 0/1 rows so training is safe.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Kolkata
        run: |
          cd backend
          python ai/providers/ml_provider.py
        continue-on-error: true   # skip gracefully if < 30 trades

      - name: Upload trained conviction model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-${{ github.run_id }}
          path: backend/models/
          retention-days: 30

      - name: Train ML regime classifier (Phase 2+)
        # Only meaningful after ml_regime_classifier.py is built (§2.4).
        # Non-fatal — exits cleanly if script not yet present.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Kolkata
        run: |
          cd backend
          python ai/providers/ml_regime_classifier.py --train 2>/dev/null || echo "ml_regime_classifier not yet built — skipping"
        continue-on-error: true

      - name: Run evolution tracker — strategy proposals + Tier 1 threshold optimisation
        # Existing: analyzes closed_positions + signal_log → strategy_config proposals.
        # Phase 2 extension (§2.10): also runs Tier 1 signal threshold analysis → system_config proposals.
        # All proposals are PENDING — nothing is auto-applied without your approval.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY:     ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          cd backend
          python history/evolution_tracker.py
        continue-on-error: true   # never fail the whole job on AI proposal errors
