# ============================================================
# TradeOS v6 — Kite Token Refresh
# .github/workflows/kite_token_refresh.yml
#
# IMPORTANT: This workflow is MANUAL ONLY — workflow_dispatch.
# Zerodha requires browser-based login for every new access token.
# There is NO automated cron version of this — that would violate
# Zerodha's API terms and is technically impossible (TOTP + OAuth).
#
# DAILY ROUTINE (Phase 2+):
#   1. Open GitHub → Actions → "Kite Token Refresh"
#   2. Click "Run workflow" → Enter your request_token
#   3. Workflow calls kite_token_refresh.py which exchanges it
#      for an access_token and writes it to Supabase system_config
#   4. All Phase 2 scripts (sl_monitor, kite_reconcile, execution_engine)
#      read the token from system_config — no manual copy-paste
#
# HOW TO GET request_token EACH MORNING (8:25–8:30 AM IST):
#   1. Open in browser:
#      https://kite.zerodha.com/connect/login?api_key=YOUR_KITE_API_KEY&v=3
#   2. Login with your Zerodha credentials + TOTP
#   3. After redirect, copy the `request_token` from the URL:
#      https://yourapp.com/redirect?request_token=XXXXXXXX&action=login&status=success
#   4. Paste that token in the GitHub Actions "Run workflow" input below
#
# PHASE GATE: Only run this when autonomy_phase >= 2 and
#             KITE_API_KEY / KITE_API_SECRET secrets are configured.
# ============================================================

name: Kite Token Refresh

on:
  workflow_dispatch:
    inputs:
      request_token:
        description: >
          Zerodha request_token from the OAuth redirect URL.
          Get it by opening: https://kite.zerodha.com/connect/login?api_key=YOUR_KEY&v=3
          Login → copy token from redirect URL parameter.
        required: true
        type: string
      dry_run:
        description: "Dry run — validate token exchange but do not write to Supabase"
        required: false
        type: boolean
        default: false

jobs:
  refresh-token:
    name: Exchange Kite request_token → access_token
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      KITE_API_KEY:          ${{ secrets.KITE_API_KEY }}
      KITE_API_SECRET:       ${{ secrets.KITE_API_SECRET }}
      DRY_RUN:               ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet \
            kiteconnect \
            supabase \
            loguru \
            python-dotenv

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.request_token }}" ]; then
            echo "ERROR: request_token is required"
            exit 1
          fi
          echo "request_token length: ${#REQUEST_TOKEN} chars"
          echo "dry_run: ${{ inputs.dry_run }}"
        env:
          REQUEST_TOKEN: ${{ inputs.request_token }}

      - name: Exchange token and write to Supabase
        run: |
          python backend/kite/kite_token_refresh.py \
            --request-token "${{ inputs.request_token }}"
        env:
          REQUEST_TOKEN: ${{ inputs.request_token }}

      - name: Verify token written to system_config
        if: ${{ !inputs.dry_run }}
        run: |
          python - <<'PYEOF'
          import os, sys
          sys.path.insert(0, "backend")
          from config import get_supabase
          sb = get_supabase()
          rows = sb.table("system_config").select("key,value,updated_at") \
                   .in_("key", ["kite_access_token", "kite_token_refreshed_at"]) \
                   .execute().data
          if not rows:
              print("ERROR: No kite_access_token in system_config — token write failed")
              sys.exit(1)
          for r in rows:
              val = r["value"]
              masked = val[:6] + "..." + val[-4:] if val and len(val) > 10 else val
              print(f"  {r['key']}: {masked}  (updated: {r['updated_at']})")
          print("Token refresh verified ✅")
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "## Kite Token Refresh" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Token is valid for the current trading day (Zerodha resets at midnight IST)." >> $GITHUB_STEP_SUMMARY
          echo "> Run this workflow again tomorrow before market open (8:25–8:30 AM IST)." >> $GITHUB_STEP_SUMMARY