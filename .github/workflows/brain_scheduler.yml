name: TradeOS Brain Scheduler

# ─── SCHEDULE OVERVIEW (all times IST = UTC+5:30) ────────────────────────────
# Mon–Fri 20:30 IST  → performance_tracking    (0 15 * * 1-5)
# Wed     19:30 IST  → brain_quant_midweek      (0 14 * * 3)
# Sat     10:00 IST  → script_scan_weekly       (30 4 * * 6)
# Sun     19:30 IST  → brain_full_weekly        (0 14 * * 0)
# Sun     21:00 IST  → expire_proposals         (30 15 * * 0)
# DAILY   09:00 IST  → outcomes_watch           (30 3 * * *)
#
# outcomes_watch runs EVERY day, weekends included, and that is the point.
# Intraday outcome resolution has no scheduler of its own — it is a side-effect
# of the intraday daemon's shutdown — so the failure mode being watched for is
# "the daemon did not run", and a check that only runs on trading days shares
# the blind spot it is meant to cover. 14-Aug-2026 (a Friday) left 1289
# detections unscored; the next daemon exit was Monday and the weekly review
# was Sunday, so nothing would have noticed until after the evidence was
# already consumed. This job would have said so on Saturday morning.
#
# weekly_perf_digest no longer lives in a separate workflow. It used to be in
# brain_sunday_chain.yml, triggered via workflow_run — but that trigger fires
# on ANY completion of THIS workflow (all 5 schedules above, ~9 runs/week),
# not specifically after brain_full_weekly, so the digest was firing far more
# often than intended. It's now sent directly from inside brain_full_weekly's
# own job (brain_engine.run(mode="full") computes weekly metrics and sends the
# digest in the same process) — exactly once, exactly when this job runs.
# brain_sunday_chain.yml should be deleted from the repo; it's no longer used.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 15 * * 1-5'   # performance_tracking
    - cron: '0 14 * * 3'     # brain_quant_midweek
    - cron: '30 4 * * 6'     # script_scan_weekly
    - cron: '0 14 * * 0'     # brain_full_weekly
    - cron: '30 15 * * 0'    # expire_proposals
    - cron: '30 3 * * *'     # outcomes_watch — DAILY, weekends included
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        type: choice
        options:
          - performance_tracking
          - brain_full_weekly
          - brain_quant_midweek
          - script_scan_weekly
          - expire_proposals
          - outcomes_watch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Kolkata

defaults:
  run:
    working-directory: backend

# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 — Performance Tracking (Mon–Fri 20:30 IST)
# ═════════════════════════════════════════════════════════════════════════════
jobs:
  performance_tracking:
    name: "📊 Performance Tracking"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.schedule == '0 15 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'performance_tracking')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Run performance tracking
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from swing.brain.performance_tracker import run_performance_tracking; run_performance_tracking()"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-tracking-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 5

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 — Brain Quant Mid-Week (Wednesday 19:30 IST)
# ═════════════════════════════════════════════════════════════════════════════
  brain_quant_midweek:
    name: "🔬 Brain Quant (Mid-Week)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.schedule == '0 14 * * 3' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brain_quant_midweek')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Run quant brain
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m swing.brain.brain_engine --mode quant

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brain-quant-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 5

# ═════════════════════════════════════════════════════════════════════════════
# JOB 3 — Script Scanner (Saturday 10:00 IST)
# Now also runs behavioral profiling (new/changed scripts only) and the
# cross-script consistency check — both LLM-based, hence the AI provider key
# below, which this job didn't need/have before. Timeout raised accordingly:
# was fine at 10 min for pure AST scanning, tight once it's making one LLM
# call per changed file plus one batched consistency-check call.
# ═════════════════════════════════════════════════════════════════════════════
  script_scan_weekly:
    name: "🔍 Script Scanner (Weekly)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event.schedule == '30 4 * * 6' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'script_scan_weekly')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Run script scanner (scan + profile + consistency check)
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY:           ${{ secrets.GROK_API_KEY }}
          AZURE_OPENAI_API_KEY:   ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT:  ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m swing.brain.brain_engine --mode scan

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: script-scan-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 5

# ═════════════════════════════════════════════════════════════════════════════
# JOB 4 — Brain Full Weekly (Sunday 19:30 IST)
# Now also computes + sends the weekly performance digest directly at the end
# of its own run (brain_engine.py, mode="full") — see note at top of file.
# ═════════════════════════════════════════════════════════════════════════════
  brain_full_weekly:
    name: "🧠 Brain Full (Weekly)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      github.event.schedule == '0 14 * * 0' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brain_full_weekly')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Run full brain
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY:           ${{ secrets.GROK_API_KEY }}
          AZURE_OPENAI_API_KEY:   ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT:  ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m swing.brain.brain_engine --mode full

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brain-full-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7

# ═════════════════════════════════════════════════════════════════════════════
# JOB 5 — Expire Old Proposals (Sunday 21:00 IST)
# No ordering dependency — safe to run on clock time
# ═════════════════════════════════════════════════════════════════════════════
  expire_proposals:
    name: "🗑️ Expire Old Proposals"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: |
      github.event.schedule == '30 15 * * 0' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'expire_proposals')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Expire stale proposals
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          from config import get_supabase
          from datetime import datetime, timezone
          sb = get_supabase()
          result = sb.table('brain_proposals').update({'status':'EXPIRED'}).eq('status','PENDING').lt('expires_at', datetime.now(timezone.utc).isoformat()).execute()
          print(f'Expired proposals: {len(result.data)}')
          "

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expire-proposals-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 3

# ═════════════════════════════════════════════════════════════════════════════
# JOB 6 — Outcomes Watch (DAILY 09:00 IST, weekends included)
# ═════════════════════════════════════════════════════════════════════════════
# Alerts when a past trading session's intraday detections were never scored.
#
# WHY THIS IS NOT A HEALTH CHECK. tools/health.py has reported this correctly
# since it was written, and reporting is not the same as being read: the
# 14-Aug-2026 gap surfaced three days late because an unrelated session
# happened to run the sweep. A day of lost evidence is silent by construction —
# an unscored session contributes no rows, which looks exactly like a quiet
# engine to everything downstream.
#
# WHY IT CANNOT LIVE IN THE INTRADAY DAEMON. The failure being watched for IS
# the daemon not running, or not exiting cleanly, or not holding the lease. An
# alert fired from that process is silent under precisely the conditions that
# make it necessary.
#
# Writes nothing to the book. `--check-and-alert` exits 1 when it alerts, so a
# red run in the Actions tab is a second, independent channel — deliberate.
  outcomes_watch:
    name: "🔍 Outcomes Watch"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.schedule == '30 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'outcomes_watch')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Alert on any session that was never scored
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m intraday.outcomes --check-and-alert
