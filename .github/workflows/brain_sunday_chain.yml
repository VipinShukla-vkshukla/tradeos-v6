name: TradeOS Brain Sunday Chain

# ─────────────────────────────────────────────────────────────────────────────
# This workflow does NOT run on a clock/cron schedule.
#
# It fires automatically when "TradeOS Brain Scheduler" completes.
# Specifically: it runs weekly_perf_digest only after brain_full_weekly
# has finished successfully — regardless of when GH Actions actually ran it.
#
# WHY THIS EXISTS:
# GH Actions scheduled jobs can be delayed 30–90 minutes at peak times.
# brain_full_weekly (Sunday 19:30 IST) and weekly_perf_digest (Sunday 20:00 IST)
# are only 30 minutes apart. If brain_full is delayed by even 45 minutes,
# a clock-based digest would fire on stale data before the brain finishes.
#
# This file solves that by making weekly_perf_digest event-driven, not time-driven.
# It always runs after brain_full completes — 5 minutes later or 2 hours later,
# it doesn't matter. Correct ordering is guaranteed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["TradeOS Brain Scheduler"]   # must match the `name:` in brain_scheduler.yml exactly
    types: [completed]
  workflow_dispatch:   # allows manual "Run workflow" button in GitHub UI for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Kolkata

defaults:
  run:
    working-directory: backend
    # Every `run:` step below already executes from backend/ because of
    # this default — a step must NOT also `cd backend &&`, or it tries to
    # enter backend/backend, fails immediately, and (masked by continue-
    # on-error: true on every step past "Send weekly Telegram digest")
    # reports green while doing nothing. Found F-80, 25-Aug-2026: EVERY
    # step from "Weekly learning review" through "Refresh ipo_listings"
    # (8 of them, added across five separate commits since 16-Aug) had
    # this exact bug and had been silently no-op-ing on every run since —
    # including the one that had just wired the Stage E6 recency
    # validator into this same file hours earlier. docs/FINDINGS.md F-80.

jobs:
  weekly_perf_digest:
    name: "📨 Weekly Perf Digest (Telegram)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only run when either:
    # A) Triggered by workflow_run: brain_scheduler completed a scheduled run successfully
    #    (not a manual run — avoids digest firing every time you test brain_full manually)
    # B) Triggered manually via workflow_dispatch (for testing)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install apscheduler pyyaml scipy

      - name: Send weekly Telegram digest
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from swing.brain.performance_tracker import send_weekly_telegram_summary; send_weekly_telegram_summary()"

      # The trading-performance half of the weekly learning pass.
      #
      # The brain has run every Sunday since May and every one of its 43
      # proposals is a CODE_SUGGESTION — it reviews the codebase, not the
      # results. Nothing was scoring engines on their outcomes, checking whether
      # a gate refused setups that would have worked, or testing whether the
      # entry ranking separates winners. That ran only when someone remembered.
      #
      # Same table, different `source`, so both halves read together.
      - name: "Weekly learning review (trading outcomes)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m tools.weekly_review

      # Track E, Stage E6 (F-77/F-79) — re-check every PENDING SWING/
      # feature-edge finding against fresh data before it can ever be
      # trusted. Built as a standing tool with no automatic trigger of
      # its own; wired in here, next to the review it was designed to
      # feed, rather than left as something only ever run by hand.
      # continue-on-error, same as every other step in this chain — a
      # skipped validation pass must not fail the whole weekly run.
      - name: "Swing feature-edge recency validation (Stage E6)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m tools.swing_feature_edge_study --validate

      # Discovery, after the review. The review judges the engines that
      # exist; this looks for the ones that do not — the moves no engine saw at
      # all, which appear in no P&L because there is no losing trade to notice.
      - name: "Engine discovery (SHADOW candidates)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m tools.discover_engines --days 21

      # Which SPECIFIC setups within an engine work, not just whether the
      # engine does — volume_ratio, ATR, sector, regime, hour-of-day, mined
      # against realised outcome, per (engine, condition). Same
      # propose-never-apply contract as the two steps above: writes
      # FEATURE_FILTER rows to brain_proposals, changes nothing on its own.
      - name: "Feature-level edge study (which setup traits predict outcome)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m tools.feature_edge_study

      # Resolve anything the daemon left unscored BEFORE the two analyses above
      # would have read it. Kept as its own step rather than folded into them,
      # so a broker-session failure here is visible instead of silently
      # shrinking the sample every engine verdict rests on.
      - name: "Backfill unresolved intraday outcomes"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m intraday.outcomes --backfill

      # The two steps above say which ENGINES and GATES are working. This says
      # which SWITCHES to move as a result — the question the operator actually
      # faces, and the one nothing joined up before. It also reports what each
      # panel control puts at RISK rather than at notional, and flags controls
      # that cannot bind at all.
      - name: "Control Room settings advisor"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOTAL_CAPITAL:        ${{ secrets.TOTAL_CAPITAL }}
          TZ: Asia/Kolkata
        run: |
          python -m tools.control_room --propose

      # Weekly, matching NSE's own index-reconstitution cadence — nothing
      # about this changes daily. Feeds intraday/scanner.py::unreferenced_
      # candidates() (Population B, Stage D2b) and compute_indicators.py's
      # own nifty_200/nifty_500 tagging. Upsert-only, never deletes; a
      # fetch failure on either sub-index leaves that one flag column
      # untouched rather than overwriting it from nothing.
      - name: "Refresh nifty_total_market (index constituents)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Kolkata
        run: |
          python -m swing.ingestion.ingest_nifty_total_market

      # Weekly — NSE closes a mainboard IPO a handful of times a week,
      # not daily. Feeds intraday/scanner.py::recent_ipo_candidates()
      # (Population C, Stage D2f) with AUTHORITATIVE listing dates
      # straight from NSE's own archive, replacing the raw_prices-based
      # heuristic the operator had scrapped after live-testing found
      # real coverage-gap false positives in it.
      - name: "Refresh ipo_listings (NSE confirmed IPO archive)"
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Kolkata
        run: |
          python -m swing.ingestion.ingest_ipo_listings

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-digest-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 3
