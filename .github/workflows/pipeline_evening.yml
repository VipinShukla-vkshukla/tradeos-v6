name: TradeOS v6 Evening Pipeline

on:
  schedule:
    - cron: '30 12 * * 1-5'  # 6:00 PM IST (12:30 UTC), weekdays only
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:                                          # ← ADD THIS
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← ADD THIS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      
      - name: Create credentials file
        run: |
          mkdir -p backend/credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > backend/credentials/service_account.json

      - name: Run pipeline
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHARTINK_EMAIL:         ${{ secrets.CHARTINK_EMAIL }}
          CHARTINK_PASSWORD:      ${{ secrets.CHARTINK_PASSWORD }}
          GOOGLE_SHEET_ID:        ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: credentials/service_account.json
          TOTAL_CAPITAL:          ${{ secrets.TOTAL_CAPITAL }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY:           ${{ secrets.GROK_API_KEY }}
          AZURE_OPENAI_API_KEY:   ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT:  ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 1
          cd backend
          python run_pipeline.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 7

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chartink-debug-${{ github.run_id }}
          path: |
            backend/chartink_hover_debug.png
            backend/chartink_debug.png
          retention-days: 3
