name: TradeOS v6 Evening Pipeline

on:
  #schedule:
  #  - cron: '30 12 * * 1-5'   # fallback only — 6:00 PM IST (12:30 UTC)
  workflow_dispatch:
    types: [evening_pipeline_dispatch]
  repository_dispatch:
    types: [evening_pipeline_dispatch]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:                                          # ← ADD THIS
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← ADD THIS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      
      - name: Run pipeline
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHARTINK_EMAIL:         ${{ secrets.CHARTINK_EMAIL }}
          CHARTINK_PASSWORD:      ${{ secrets.CHARTINK_PASSWORD }}
          GOOGLE_SHEET_ID:        ${{ secrets.GOOGLE_SHEET_ID }}
          TOTAL_CAPITAL:          ${{ secrets.TOTAL_CAPITAL }}
          KITE_API_KEY:           ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:        ${{ secrets.KITE_API_SECRET }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY:           ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          AZURE_OPENAI_API_KEY:   ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT:  ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Google Sheets credentials removed — system uses NSE API and Supabase only