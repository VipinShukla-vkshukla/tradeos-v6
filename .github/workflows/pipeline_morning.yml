name: TradeOS v6 — Morning Pre-Market Brief

# ONE job, ONE Telegram message at 7:00 AM IST.
#
# Sequence inside the job:
#   1. ingest_global_cues.py MORNING  — fetches true US close-to-close prices
#   2. send_alerts.py --morning       — ONE consolidated brief containing:
#        • Overnight global cues (Gift Nifty gap, DOW, S&P, crude, USD/INR)
#        • BUY candidates + AI conviction + entry zones
#        • Open positions SL proximity watch
#        • Position event risk (results/board meetings on held stocks, next 5d)
#
# Kite reconcile (kite_reconcile.py) is Phase 2+.
# Wire it here when autonomy_phase is set to 2 and Kite token is active.
#
# Position event monitor runs here (after the brief) so a results/board meeting
# on a held stock reaches you before the open.
# Stop/target/trailing checks run every 30 min via pipeline_intraday.yml;
# the evening digest runs via pipeline_evening.yml.

on:
  #schedule:
  #  - cron: '30 3 * * 1-5'    # fallback only
  workflow_dispatch:
    types: [morning_alert_dispatch]
  repository_dispatch:
    types: [morning_alert_dispatch]

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python swing/ingestion/ingest_global_cues.py MORNING

      - name: Send consolidated morning brief
        # Single Telegram message — global cues + BUY candidates + SL watch + event risk
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python alerts/send_alerts.py --morning

      - name: Pre-market event brief for held positions
        # Results/board meetings/AGMs inside the lookahead window. Writes
        # HIGH/MEDIUM rows to data_anomalies and sends one consolidated
        # Telegram brief. Non-fatal: the morning brief above is already sent.
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python -m swing.ingestion.position_event_monitor

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: morning-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 3