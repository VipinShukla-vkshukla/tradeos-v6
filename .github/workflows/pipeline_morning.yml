name: TradeOS v6 — Morning Pre-Market Brief

# ONE job, ONE Telegram message at 7:00 AM IST.
#
# Sequence inside the job:
#   1. ingest_global_cues.py MORNING  — fetches true US close-to-close prices
#   2. send_alerts.py --morning       — ONE consolidated brief containing:
#        • Overnight global cues (Gift Nifty gap, DOW, S&P, crude, USD/INR)
#        • BUY candidates + AI conviction + entry zones
#        • Open positions SL proximity watch
#        • Position event risk (results/board meetings on held stocks, next 5d)
#
# Kite reconcile (kite_reconcile.py) is Phase 2+.
# Wire it here when autonomy_phase is set to 2 and Kite token is active.
#
# sl_monitor.py runs separately every 30 min during market hours via pipeline_intraday.yml
# Evening digest runs at 6 PM via pipeline_daily.yml

on:
  schedule:
    - cron: '30 1 * * 1-5'    # fallback only
  workflow_dispatch:
  repository_dispatch:
    types: [morning_alert_dispatch]

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create credentials file
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p backend/credentials
          echo "$GOOGLE_CREDS" > backend/credentials/service_account.json

      - name: Fetch morning global cues (MORNING session)
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python ingestion/ingest_global_cues.py MORNING

      - name: Send consolidated morning brief
        # Single Telegram message — global cues + BUY candidates + SL watch + event risk
        working-directory: backend
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: python alerts/send_alerts.py --morning

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: morning-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 3