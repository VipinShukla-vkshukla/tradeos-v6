name: TradeOS Afternoon Alert

on:
  #schedule:
  #  - cron: '30 7 * * 1-5'   # 1:00 PM IST (07:30 UTC), weekdays only
  workflow_dispatch:           # Manual trigger from GitHub UI
  repository_dispatch:
    types: [afternoon_alert_dispatch]

jobs:
  afternoon_alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create credentials file
        run: |
          mkdir -p backend/credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > backend/credentials/service_account.json

      - name: Run afternoon alert
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SHEET_ID:          ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON:  credentials/service_account.json
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kolkata
        run: |
          cd backend
          python -m alerts.send_alerts --afternoon

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-alert-logs-${{ github.run_id }}
          path: backend/logs/
          retention-days: 3