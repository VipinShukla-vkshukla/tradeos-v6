// ── Data layer ────────────────────────────────────────────────────────────────
async function qry(table, select="*", filters={}, order=null, lim=null) {
  if (!sb) return null;
  try {
    let r = sb.from(table).select(select);
    for (const [k,v] of Object.entries(filters)) r = r.eq(k,v);
    if (order) r = r.order(order.col, {ascending: order.asc ?? false});
    if (lim) r = r.limit(lim);
    const { data, error } = await r;
    if (error) throw error;
    return data || [];
  } catch(e) { console.error(`❌ Supabase query FAILED [${table}]:`, e.message);return null; }
}
async function saveCfg(key, val) {
  if (!sb) return;
  await sb.from("system_config").update({value: String(val)}).eq("key", key);
}

// ── SVG Sparkline ─────────────────────────────────────────────────────────────
const Sparkline = ({data, width=100, height=32, color=C.accent, fill=true}) => {
  if (!data || data.length < 2) return <div style={{width,height,background:C.border+"44",borderRadius:4}}/>;
  const vals = data.map(d => typeof d === "number" ? d : d.value || 0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const pts = vals.map((v,i) => [
    (i/(vals.length-1)) * width,
    height - ((v - min) / range) * (height-4) - 2
  ]);
  const line = pts.map((p,i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${width},${height} L0,${height} Z`;
  return (
    <svg width={width} height={height} style={{overflow:"visible"}}>
      <defs>
        <linearGradient id={`sg-${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity={0.25}/>
          <stop offset="100%" stopColor={color} stopOpacity={0.01}/>
        </linearGradient>
      </defs>
      {fill && <path d={area} fill={`url(#sg-${color.replace("#","")})`}/>}
      <path d={line} fill="none" stroke={color} strokeWidth={1.5} strokeLinejoin="round"/>
    </svg>
  );
};

// ── SVG Area Chart ────────────────────────────────────────────────────────────
const AreaChart = ({data, width="100%", height=140, color=C.accent, xKey="date", yKey="value", showGrid=true, yFormat=v=>`₹${(v/1000).toFixed(0)}k`}) => {
  const ref = useRef(null);
  const [w, setW] = useState(400);
  useEffect(()=>{
    if(!ref.current) return;
    const ro = new ResizeObserver(e => setW(e[0].contentRect.width));
    ro.observe(ref.current);
    return ()=>ro.disconnect();
  },[]);

  const vals = data.map(d=>d[yKey]||0);
  const min = Math.min(...vals) * 0.995;
  const max = Math.max(...vals) * 1.005;
  const range = max - min || 1;
  const pad = {l:48, r:8, t:8, b:24};
  const cw = w - pad.l - pad.r;
  const ch = height - pad.t - pad.b;

  const px = i => pad.l + (i/(data.length-1||1)) * cw;
  const py = v => pad.t + ch - ((v-min)/range)*ch;

  const pts = data.map((d,i) => [px(i), py(d[yKey]||0)]);
  const line = pts.map((p,i)=>`${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${pad.l+cw},${pad.t+ch} L${pad.l},${pad.t+ch} Z`;

  const gid = `ac${color.replace(/[^a-z0-9]/gi,"")}`;
  const yTicks = [min, min+range*0.25, min+range*0.5, min+range*0.75, max];
  const xStep = Math.max(1, Math.floor(data.length/5));

  return (
    <div ref={ref} style={{width, position:"relative"}}>
      <svg width={w} height={height}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity={0.2}/>
            <stop offset="100%" stopColor={color} stopOpacity={0.01}/>
          </linearGradient>
        </defs>
        {showGrid && yTicks.map((v,i)=>(
          <g key={i}>
            <line x1={pad.l} y1={py(v)} x2={pad.l+cw} y2={py(v)} stroke={C.border} strokeDasharray="2,4"/>
            <text x={pad.l-6} y={py(v)+4} textAnchor="end" fontSize={10} fill={C.textDim}>{yFormat(v)}</text>
          </g>
        ))}
        {data.map((d,i)=> i%xStep===0 && (
          <text key={i} x={px(i)} y={height-4} textAnchor="middle" fontSize={10} fill={C.textDim}>
            {String(d[xKey]||"").slice(-5)}
          </text>
        ))}
        <path d={area} fill={`url(#${gid})`}/>
        <path d={line} fill="none" stroke={color} strokeWidth={1.5} strokeLinejoin="round"/>
      </svg>
    </div>

// ── SVG Bar Chart ─────────────────────────────────────────────────────────────
const BarChart = ({data, width="100%", height=100, xKey="name", yKey="value", colorKey="color", labelKey=null}) => {
  const ref = useRef(null);
  const [w, setW] = useState(300);
  useEffect(()=>{
    if(!ref.current) return;
    const ro = new ResizeObserver(e => setW(e[0].contentRect.width));
    ro.observe(ref.current);
    return ()=>ro.disconnect();
  },[]);

  const vals = data.map(d=>d[yKey]||0);
  const max = Math.max(...vals.map(Math.abs)) || 1;
  const pad = {l:8, r:8, t:8, b:20};
  const cw = w - pad.l - pad.r;
  const ch = height - pad.t - pad.b;
  const bw = cw/data.length - 4;
  const mid = pad.t + ch/2;

  return (
    <div ref={ref} style={{width}}>
      <svg width={w} height={height}>
        <line x1={pad.l} y1={mid} x2={pad.l+cw} y2={mid} stroke={C.border}/>
        {data.map((d,i)=>{
          const v = d[yKey]||0;
          const x = pad.l + i*(cw/data.length) + 2;
          const barH = Math.abs(v)/max * (ch/2);
          const y = v>=0 ? mid-barH : mid;
          const color = d[colorKey] || (v>=0 ? C.green : C.red);
          return (
            <g key={i}>
              <rect x={x} y={y} width={bw} height={barH} fill={color} rx={2} fillOpacity={0.85}/>
              <text x={x+bw/2} y={height-4} textAnchor="middle" fontSize={8} fill={C.textMuted}>
                {String(d[xKey]||"").slice(0,6)}
              </text>
              {labelKey && <text x={x+bw/2} y={v>=0?y-3:y+barH+10} textAnchor="middle" fontSize={8} fill={color} fontWeight="700">
                {d[labelKey]}
              </text>}
            </g>
          );
        })}
      </svg>
    </div>
  );
};

const PanelPositions = ({d}) => {
  const {positions, closed} = d;
  const capital = parseFloat(d.config?.total_capital||200000);
  const invested= positions.reduce((s,p)=>s+(p.invested_value||0),0);
  const curVal  = positions.reduce((s,p)=>s+(p.current_value||0),0);
  const pnl     = curVal - invested;
  const wins    = closed.filter(t=>(t.realized_pnl||0)>0);
  const losses  = closed.filter(t=>(t.realized_pnl||0)<0);
  const avgWin  = wins.length>0 ? wins.reduce((s,t)=>s+(t.pnl_pct||0),0)/wins.length : 0;
  const avgLoss = losses.length>0 ? losses.reduce((s,t)=>s+(t.pnl_pct||0),0)/losses.length : 0;

  const stratPerf = useMemo(()=>{
    const m={};
    closed.forEach(t=>{
      if(!m[t.strategy]) m[t.strategy]={w:0,l:0,pnl:0};
      if((t.realized_pnl||0)>0) m[t.strategy].w++; else m[t.strategy].l++;
      m[t.strategy].pnl += t.realized_pnl||0;
    });
    return Object.entries(m).map(([s,v])=>({name:s,pnl:v.pnl,wr:v.w+v.l>0?v.w/(v.w+v.l)*100:0,w:v.w,l:v.l}));
  },[closed]);

  return (
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
        <KPI label="Total Invested" value={inr(invested)} icon="💰"/>
        <KPI label="Current Value"  value={inr(curVal)} color={clr(pnl)} icon="📊"/>
        <KPI label="Unrealized P&L" value={inr(pnl)} color={clr(pnl)} sub={pct(invested>0?pnl/invested*100:0)} icon="📈"/>
        <KPI label="Avg Win"  value={`+${avgWin.toFixed(1)}%`}  color={C.green} icon="✅"/>
        <KPI label="Avg Loss" value={`${avgLoss.toFixed(1)}%`}  color={C.red}   icon="❌"/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 260px",gap:12}}>

// ─────────────────────────────────────────────────────────────────────────────
// ANALYTICS PANEL
// ─────────────────────────────────────────────────────────────────────────────
const PanelAnalytics = ({d}) => {
  const {closed, msl} = d;
  const capital = parseFloat(d.config?.total_capital||200000);

  const {curve, maxDD, finalVal} = useMemo(()=>{
    const sorted=[...closed].sort((a,b)=>new Date(a.exit_date||0)-new Date(b.exit_date||0));
    let running=capital, peak=capital, maxDD=0;
    const curve=sorted.map(t=>{
      running+=t.realized_pnl||0;
      if(running>peak) peak=running;
      const dd=peak>0?(peak-running)/peak*100:0;
      if(dd>maxDD) maxDD=dd;
      return {date:t.exit_date||"",value:running,drawdown:dd};
    });
    return {curve, maxDD, finalVal:running};
  },[closed,capital]);

  const wins=closed.filter(t=>(t.realized_pnl||0)>0);
  const losses=closed.filter(t=>(t.realized_pnl||0)<0);
  const totalPnl=closed.reduce((s,t)=>s+(t.realized_pnl||0),0);
  const wr=closed.length>0?(wins.length/closed.length)*100:0;
  const expectancy=closed.length>0?totalPnl/closed.length:0;

  const stratBar = useMemo(()=>{
    const m={};
    closed.forEach(t=>{ if(!m[t.strategy]) m[t.strategy]=0; m[t.strategy]+=t.realized_pnl||0; });
    return Object.entries(m).map(([name,pnl])=>({name,value:pnl,color:pnl>=0?C.green:C.red}));
  },[closed]);

  const monthBar = useMemo(()=>{
    const m={};
    closed.forEach(t=>{
      const mo=(t.exit_date||"").slice(0,7);
      if(!m[mo]) m[mo]=0;
      m[mo]+=t.realized_pnl||0;
    });
    return Object.entries(m).sort().map(([d,v])=>({name:d.slice(5),value:v,color:v>=0?C.green:C.red}));
  },[closed]);

  return (
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
        <KPI label="Total Trades"  value={closed.length} icon="📋"/>
        <KPI label="Win Rate"      value={`${wr.toFixed(1)}%`} color={wr>=55?C.green:wr>=45?C.yellow:C.red} icon="🎯"/>
        <KPI label="Total P&L"     value={inr(totalPnl)} color={clr(totalPnl)} icon="💰"/>
        <KPI label="Max Drawdown"  value={`${maxDD.toFixed(1)}%`} color={maxDD>15?C.red:maxDD>8?C.yellow:C.green} icon="📉"/>
        <KPI label="Expectancy"    value={inr(expectancy)} sub="avg per trade" color={clr(expectancy)} icon="⚡"/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:8,alignItems:"start",marginBottom:0}}>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Card style={{alignSelf:"start"}}>
            <SecHead label="Equity Curve" right={`${closed.length} trades`}/>
            {curve.length>=2
              ? <AreaChart data={curve} height={150} color={C.accent} xKey="date" yKey="value"/>
              : <div style={{height:150,display:"flex",alignItems:"center",justifyContent:"center",color:C.textMuted,fontSize:11}}>No data yet</div>
            }
          </Card>
          <Card>
            <SecHead label="Drawdown"/>
            {curve.length>=2
              ? <AreaChart data={curve} height={80} color={C.red} xKey="date" yKey="drawdown"
                  yFormat={v=>`-${v.toFixed(0)}%`}/>
              : <div style={{height:80}}/>
            }
          </Card>
          <Card>
            <SecHead label="Monthly P&L"/>
            {monthBar.length>0
              ? <BarChart data={monthBar} height={80} xKey="name" yKey="value" colorKey="color"/>
              : <div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center",color:C.textMuted,fontSize:11}}>No data</div>
            }
          </Card>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Card>
            <SecHead label="Strategy P&L"/>
            {stratBar.length>0
              ? <BarChart data={stratBar} height={100} xKey="name" yKey="value" colorKey="color"/>
              : <div style={{height:100}}/>
            }
          </Card>
          <Card>
            <SecHead label="Win / Loss"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div style={{textAlign:"center",padding:"10px",background:`${C.green}11`,borderRadius:6,border:`1px solid ${C.green}22`}}>
                <div style={{fontSize:24,fontWeight:700,color:C.green}}>{wins.length}</div>
                <div style={{fontSize:9,color:C.textMuted}}>WINS</div>
              </div>
              <div style={{textAlign:"center",padding:"10px",background:`${C.red}11`,borderRadius:6,border:`1px solid ${C.red}22`}}>
                <div style={{fontSize:24,fontWeight:700,color:C.red}}>{losses.length}</div>
                <div style={{fontSize:9,color:C.textMuted}}>LOSSES</div>
              </div>
            </div>
            <div style={{height:8,background:C.border,borderRadius:4,overflow:"hidden",marginBottom:4}}>
              <div style={{width:`${closed.length>0?wr:0}%`,height:"100%",
                background:`linear-gradient(90deg,${C.green},${C.accent})`,borderRadius:4}}/>
            </div>
            <div style={{fontSize:9,color:C.textMuted,textAlign:"center"}}>{wr.toFixed(1)}% win rate</div>
          </Card>
          <Card>
            <SecHead label="Risk Metrics"/>
            {[
              ["Max Drawdown",`${maxDD.toFixed(1)}%`,maxDD>15?C.red:maxDD>8?C.yellow:C.green],
              ["Best Trade",  inr(Math.max(...closed.map(t=>t.realized_pnl||0))), C.green],
              ["Worst Trade", inr(Math.min(...closed.map(t=>t.realized_pnl||0))), C.red],
              ["Avg Win",     `+${(wins.length>0?wins.reduce((s,t)=>s+(t.pnl_pct||0),0)/wins.length:0).toFixed(1)}%`, C.green],
              ["Avg Loss",    `${(losses.length>0?losses.reduce((s,t)=>s+(t.pnl_pct||0),0)/losses.length:0).toFixed(1)}%`, C.red],
            ].map(([k,v,c])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
                <span style={{fontSize:10,color:C.textMuted}}>{k}</span>
                <span style={{fontSize:10,fontWeight:700,color:c}}>{v}</span>
              </div>
            ))}
          </Card>
        </div>
      </div>
    </div>
  );
};

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div>
          {/* Phase bar */}
          <Card style={{marginBottom:10}}>
            <SecHead label="Autonomy Phase Progression"/>
            <div style={{display:"flex",gap:0,marginBottom:10}}>
              {phases.map((p,i)=>(
                <div key={i} style={{flex:1,textAlign:"center",padding:"5px 3px",
                  background:i===phase?`${C.accent}22`:i<phase?`${C.green}11`:"transparent",
                  border:`1px solid ${i===phase?C.accent:i<phase?C.green:C.border}`,
                  borderRadius:i===0?"4px 0 0 4px":i===phases.length-1?"0 4px 4px 0":"0",
                  marginLeft:i>0?-1:0}}>
                  <div style={{fontSize:8,color:i===phase?C.accent:i<phase?C.green:C.textMuted,fontWeight:700}}>{p}</div>
                </div>
              ))}
            </div>
            <div style={{fontSize:10,color:C.textDim}}>
              {["Phase 0: Sheet ingestion + signals + frontend live.",
                "Phase 1: AI enrichment, FII/DII, global cues, scanner.",
                "Phase 2: Kite live prices. Sheet becomes read-only.",
                "Phase 3: Trade execution via Telegram approval.",
                "Phase 4: Full autonomy with guardrails + self-evolution."][phase]}
            </div>
          </Card>

          <Sec title="Position Management">
            <Row label="Max positions — RISK ON"   sub="Max open in bull market"><Num k="max_positions_risk_on" min={4} max={12}/></Row>
            <Row label="Max positions — NEUTRAL"                                ><Num k="max_positions_neutral" min={4} max={10}/></Row>
            <Row label="Max positions — RISK OFF"  sub="Capital protection mode"><Num k="max_positions_risk_off" min={3} max={8}/></Row>
            <Row label="Block BUY in RISK OFF"     sub="Off = show with warning only"><Tog k="block_buys_risk_off"/></Row>
            <Row label="Max sector concentration %" sub="Max % in single sector"><Num k="max_sector_concentration" min={15} max={40}/></Row>
            <Row label="Total Capital (₹)"         sub="Used for P&L %"><Num k="total_capital" min={50000} max={10000000}/></Row>
          </Sec>

          <Sec title="Signal Filters">
            <Row label="Min score to show" sub="Signals below hidden"><Num k="min_score_to_show" min={0} max={100}/></Row>
            <Row label="Show WATCHING stocks"><Tog k="show_watching_stocks"/></Row>
            <Row label="BUY threshold %" sub="Entry vs price tolerance"><Num k="buy_candidate_threshold_pct" min={0.1} max={3}/></Row>
          </Sec>
        </div>

        <div>
          <Sec title="AI Configuration">
            <Row label="Active Provider" sub="No code change needed">
              <Sel k="ai_provider" opts={[
                {v:"disabled",l:"Disabled"},{v:"claude",l:"Claude (Anthropic)"},
                {v:"openai",l:"ChatGPT (OpenAI)"},{v:"gemini",l:"Gemini (Google)"},
                {v:"deepseek",l:"DeepSeek"},{v:"grok",l:"Grok (xAI)"},
                {v:"copilot",l:"Copilot (Azure)"},{v:"ml",l:"ML Model (Free)"},
              ]}/>
            </Row>
            <Row label="ML fallback"         sub="Free — trained on your trades"><Tog k="ai_fallback_ml"/></Row>
            <Row label="Web scraping fallback" sub="Free — NSE/Moneycontrol news"><Tog k="ai_fallback_scraping"/></Row>
            <Row label="Daily AI budget (₹)"  sub="0 = unlimited"><Num k="ai_daily_budget_inr" min={0} max={2000}/></Row>
            <Row label="Max stocks/day for AI"><Num k="ai_max_stocks_per_day" min={5} max={50}/></Row>
          </Sec>

          <Sec title="System">
            <Row label="Telegram alerts"><Tog k="telegram_alerts_enabled"/></Row>
            <Row label="Kill Switch" sub="Halts ALL pipeline activity">
              <button onClick={()=>save("master_kill_switch",cfg.master_kill_switch==="true"?"false":"true")}
                style={{padding:"5px 12px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",
                  background:cfg.master_kill_switch==="true"?C.red:`${C.red}22`,
                  border:`1px solid ${C.red}`,color:cfg.master_kill_switch==="true"?C.bg:C.red}}>
                {cfg.master_kill_switch==="true"?"⛔ ACTIVE — DEACTIVATE":"⛔ ACTIVATE KILL SWITCH"}
              </button>
            </Row>
          </Sec>

          <Card>
            <SecHead label="Data Connection"/>
            <div style={{fontSize:10,color:C.textMuted,marginBottom:8}}>
              Open this HTML file in Notepad and add near the bottom:
            </div>
            <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:4,
              padding:"8px 10px",fontSize:10,color:C.accent,lineHeight:1.8}}>
              {"<script>\n  window.SUPABASE_URL = \"https://...\";\n  window.SUPABASE_KEY = \"anon-key\";\n<" + "/script>"}
            </div>
            <div style={{marginTop:8,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:9,color:C.textMuted}}>Status</span>
              <span style={{fontSize:9,fontWeight:700,color:window.SUPABASE_URL?C.green:C.yellow}}>
                {window.SUPABASE_URL ? "✓ Connected to Supabase" : "Demo mode — sample data"}
              </span>
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────────────────────────────
// NAV + APP
// ─────────────────────────────────────────────────────────────────────────────
const NAV = [
  {id:"dashboard",  icon:"◈", label:"Dashboard"},
  {id:"signals",    icon:"⚡",label:"Signals"},
  {id:"positions",  icon:"◉", label:"Positions"},
  {id:"market",     icon:"⬡", label:"Market"},
  {id:"analytics",  icon:"∿", label:"Analytics"},
  {id:"intelligence",icon:"⬡",label:"Intelligence"},
  {id:"settings",   icon:"⚙", label:"Settings"},
];

function App() {
  const [panel, setPanel] = useState("dashboard");
  const [loading, setLoading] = useState(true);
  const [time, setTime] = useState(new Date());
  const [d, setD] = useState({
    regime:null, positions:[], msl:[], sectors:[], industries:[],
    events:[], signals:[], closed:[], config:{}, lastDate:null
  });

  useEffect(()=>{ const t=setInterval(()=>setTime(new Date()),1000); return()=>clearInterval(t); },[]);

  const load = useCallback(async () => {
    setLoading(true);
    
    // ── Wait for Supabase to finish loading ──
    let waited = 0;
    while (!sbReady && waited < 5000) {
      await new Promise(r => setTimeout(r, 100));
      waited += 100;
    }
    // ────────────────────────────────────────
    const [regimeRows, latestDate] = await Promise.all([
      qry("market_regime","*",{},{col:"date",asc:false},1),
      (async()=>{ if(!sb) return null; const {data}=await sb.from("master_shortlist").select("date").order("date",{ascending:false}).limit(1); return data?.[0]?.date||null; })()
    ]);
    const [mslRows, posRows, secRows, indRows, evtRows, closedRows, cfgRows] = await Promise.all([
      qry("master_shortlist","*",{date:latestDate},{col:"final_score",asc:false}, 5000),
      qry("open_positions","*",{},{col:"entry_date",asc:false}, 500),
      qry("sector_strength","*",{},{col:"rank",asc:true}, 500),
      qry("industry_strength","*",{},{col:"rank",asc:true}, 500),
      qry("event_calendar","*",{is_active:true},{col:"start_date",asc:true}, 5000),
      qry("closed_positions","*",{},{col:"exit_date",asc:false},5000),
      qry("system_config","key,value"),
    ]);
    
    const config = cfgRows ? Object.fromEntries(cfgRows.map(r=>[r.key,r.value])) : {...DEMO_CFG};
    setD({
      regime: regimeRows?.[0] || DEMO_REGIME,
      msl:    mslRows || DEMO_MSL,
      positions: posRows || DEMO_POS,
      sectors: secRows || DEMO_SECTORS,
      industries: indRows || [],
      events: evtRows || DEMO_EVENTS,
      closed: closedRows || DEMO_CLOSED,
      config,
      lastDate: latestDate,
    });
    setLoading(false);
  }, []);

  useEffect(()=>{ load(); },[load]);

  const regime = d.regime;
  const rC = {"RISK ON":C.green,"NEUTRAL":C.yellow,"RISK OFF":C.red}[regime?.regime]||C.textDim;
  const phase = parseInt(d.config?.autonomy_phase||0);
  const phaseLabels = ["MANUAL","INTEL","KITE","SUPER","AUTO"];
  const buyCnt = d.msl.filter(r=>r.position_state==="BUY_CANDIDATE").length;
  const exitCnt = d.positions.filter(p=>(p.action_required||"").toUpperCase().includes("EXIT")).length;
  const kills = d.config?.master_kill_switch === "true";

  const panels = {
    dashboard:   <PanelDashboard    d={d}/>,
    signals:     <PanelSignals      d={d}/>,
    positions:   <PanelPositions    d={d}/>,
    market:      <PanelMarket       d={d}/>,
    analytics:   <PanelAnalytics    d={d}/>,
    intelligence:<PanelIntelligence d={d}/>,
    settings:    <PanelSettings     d={d}/>,
  };

  const istStr = time.toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour12:false,
    hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const dateStr = time.toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata",
    day:"2-digit",month:"short",year:"numeric"});

  return (
    <div style={{display:"flex",width:"100vw",height:"100vh",background:C.bg,overflow:"hidden"}}>

      {/* ── Sidebar ── */}
      <div style={{width:186,flexShrink:0,background:C.surface,borderRight:`1px solid ${C.border}`,
        display:"flex",flexDirection:"column",height:"100vh"}}>
        {/* Logo */}
        <div style={{padding:"16px 14px",borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:kills?6:0}}>
            <div style={{width:28,height:28,borderRadius:6,flexShrink:0,
              background:`linear-gradient(135deg,${C.accent},${C.purple})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>◈</div>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:C.text,fontFamily:"var(--fontui)",letterSpacing:"0.07em"}}>TRADEOS</div>
              <div style={{fontSize:8,color:C.textMuted,letterSpacing:"0.1em"}}>v6 · INTELLIGENCE</div>
            </div>
          </div>
          {kills && <div style={{background:`${C.red}22`,border:`1px solid ${C.red}44`,borderRadius:3,
            padding:"2px 7px",fontSize:8,color:C.red,fontWeight:700,textAlign:"center"}}>⛔ KILL SWITCH ACTIVE</div>}
        </div>

        {/* Nav */}
        <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
          {NAV.map(item=>{
            const active = panel===item.id;
            const badge  = item.id==="signals"&&buyCnt>0 ? buyCnt : item.id==="positions"&&exitCnt>0 ? exitCnt : 0;
            return (
              <button key={item.id} onClick={()=>setPanel(item.id)} style={{
                width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"7px 9px",marginBottom:2,borderRadius:5,
                background:active?`${C.accent}18`:"transparent",
                border:`1px solid ${active?C.accent+"44":"transparent"}`,
                color:active?C.accent:C.textDim,
                cursor:"pointer",transition:"all .15s",fontSize:11,fontWeight:active?700:400}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11,opacity:.6}}>{item.icon}</span>
                  <span>{item.label}</span>
                </div>
                {badge>0&&<span style={{background:C.yellow,color:C.bg,borderRadius:9,
                  padding:"0 5px",fontSize:8,fontWeight:700}}>{badge}</span>}
              </button>
            );
          })}
        </nav>

        {/* Status footer */}
        <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:8,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>System</div>
          {[
            ["PHASE", `${phase} / ${phaseLabels[phase]}`, phase===4?C.green:phase>=2?C.accent:C.yellow],
            ["REGIME", regime?.regime||"—", rC],
            ["MODE", window.SUPABASE_URL?"LIVE":"DEMO", window.SUPABASE_URL?C.green:C.yellow],
          ].map(([k,v,c])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:9,color:C.textMuted}}>{k}</span>
              <span style={{fontSize:9,fontWeight:700,color:c}}>{v}</span>
            </div>
          ))}
          <div style={{marginTop:6}}>
            <div style={{fontSize:11,fontWeight:600,color:C.textDim,fontVariantNumeric:"tabular-nums"}}>{istStr} IST</div>
            <div style={{fontSize:9,color:C.textMuted}}>{dateStr}</div>
          </div>
          {d.lastDate && <div style={{fontSize:8,color:C.textMuted,marginTop:3}}>Data: {d.lastDate}</div>}
          <button onClick={load} style={{marginTop:6,width:"100%",padding:"3px",borderRadius:4,
            background:C.border,border:"none",color:C.textDim,fontSize:9,cursor:"pointer"}}>
            ↻ Refresh
          </button>
        </div>
      </div>

      {/* ── Main ── */}
      <div style={{flex:1,display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
        {/* Topbar */}
        <div style={{height:44,background:C.surface,borderBottom:`1px solid ${C.border}`,
          display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 18px",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:14,fontWeight:700,color:C.text,fontFamily:"var(--fontui)",letterSpacing:"0.04em"}}>
              {NAV.find(n=>n.id===panel)?.label}
            </span>
            {!window.SUPABASE_URL && <Pill color={C.yellow}>Demo Mode — add Supabase credentials for live data</Pill>}
          </div>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            {regime && (
              <div style={{display:"flex",alignItems:"center",gap:8,
                background:`${rC}12`,border:`1px solid ${rC}33`,borderRadius:5,padding:"3px 10px"}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:rC,animation:"pulse 2s infinite"}}/>
                <span style={{fontSize:9,fontWeight:700,color:rC}}>{regime.regime}</span>
                <span style={{fontSize:9,color:C.textDim}}>· Nifty {inr(regime.nifty_price)} · VIX {num(regime.india_vix)}</span>
              </div>
            )}
          </div>
        </div>

        {/* Content */}
        <div style={{flex:1,overflow:"auto",padding:14}}>
          {loading ? (
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",
              flexDirection:"column",gap:12}}>
              <div style={{width:32,height:32,border:`2px solid ${C.border}`,
                borderTop:`2px solid ${C.accent}`,borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
              <span style={{color:C.textDim,fontSize:11}}>Loading TradeOS v6...</span>
            </div>
          ) : panels[panel]}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
