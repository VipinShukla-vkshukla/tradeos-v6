# ═══════════════════════════════════════════════════════════════════════════
# TradeOS v6 — Unified Scheduler Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Two options for running this YAML config:
#
# Option A — APScheduler (recommended, pure Python):
#   pip install apscheduler pyyaml
#   python -m brain.scheduler_yaml        ← reads this file
#
# Option B — System cron (paste output of `python -m brain.scheduler_yaml --cron`):
#   Generated crontab lines with correct UTC offsets for IST (UTC+5:30)
#
# Option C — GitHub Actions (for cloud-hosted deployments):
#   See .github/workflows/tradeos_scheduler.yml template at bottom of this file
# ═══════════════════════════════════════════════════════════════════════════

timezone: "Asia/Kolkata"

jobs:

  # ── DAILY PIPELINE ───────────────────────────────────────────────────────
  daily_pipeline:
    description: "Main 21-step TradeOS pipeline"
    schedule:
      type: cron
      day_of_week: "mon-fri"   # Market days only
      hour: 18
      minute: 0
    command: "python run_pipeline.py"
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 90
    on_failure: telegram_alert
    tags: [pipeline, daily, critical]

  # ── PERFORMANCE TRACKING (runs after pipeline) ────────────────────────────
  performance_tracking:
    description: "Compute and store daily performance metrics"
    schedule:
      type: cron
      day_of_week: "mon-fri"
      hour: 20
      minute: 30
    command: "python -c \"from brain.performance_tracker import run_performance_tracking; run_performance_tracking()\""
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 15
    on_failure: log_only
    tags: [brain, metrics, daily]

  # ── WEEKLY BRAIN RUN (full: quant + LLM + Telegram digest) ───────────────
  brain_full_weekly:
    description: "Full brain analysis — quantitative + LLM synthesis + proposals"
    schedule:
      type: cron
      day_of_week: "sun"
      hour: 19
      minute: 30
    command: "python -m brain.brain_engine --mode full"
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 45
    on_failure: telegram_alert
    tags: [brain, weekly, llm]

  # ── MID-WEEK BRAIN RUN (quant only — faster, no LLM cost) ────────────────
  brain_quant_midweek:
    description: "Mid-week quant-only brain scan — no LLM, track recent signals"
    schedule:
      type: cron
      day_of_week: "wed"
      hour: 19
      minute: 30
    command: "python -m brain.brain_engine --mode quant"
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 20
    on_failure: log_only
    tags: [brain, midweek, quant]

  # ── WEEKLY PERFORMANCE TELEGRAM DIGEST ────────────────────────────────────
  weekly_perf_digest:
    description: "Send weekly performance summary to Telegram"
    schedule:
      type: cron
      day_of_week: "sun"
      hour: 20
      minute: 0
    command: "python -c \"from brain.performance_tracker import send_weekly_telegram_summary; send_weekly_telegram_summary()\""
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 5
    on_failure: log_only
    tags: [telegram, weekly, reporting]

  # ── SCRIPT SCANNER (weekly — detect new hardcoded values) ────────────────
  script_scan_weekly:
    description: "Scan all Python scripts for tunable hardcoded values"
    schedule:
      type: cron
      day_of_week: "sat"
      hour: 10
      minute: 0
    command: "python -c \"from brain.script_scanner import run_scan; run_scan()\""
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 10
    on_failure: log_only
    tags: [brain, scripts, weekly]

  # ── EXPIRE OLD PROPOSALS (monthly cleanup) ────────────────────────────────
  expire_proposals:
    description: "Mark expired brain proposals (>30 days pending)"
    schedule:
      type: cron
      day_of_week: "sun"
      hour: 21
      minute: 0
    command: >
      python -c "
      from config import get_supabase
      from datetime import datetime, timezone
      sb = get_supabase()
      sb.table('brain_proposals').update({'status':'EXPIRED'}).eq('status','PENDING').lt('expires_at', datetime.now(timezone.utc).isoformat()).execute()
      print('Expired old proposals')
      "
    working_dir: "."
    env_file: ".env"
    timeout_minutes: 2
    on_failure: log_only
    tags: [brain, cleanup, weekly]

# ── ALERT CONFIGURATION ──────────────────────────────────────────────────────
alerts:
  telegram_alert:
    enabled: true
    on_events: [failure, timeout]
    message_template: "🚨 TradeOS Job FAILED: {job_name} at {timestamp}\nError: {error}"

  log_only:
    enabled: true
    on_events: [failure]
    log_level: WARNING

---
# ═══════════════════════════════════════════════════════════════════════════
# EQUIVALENT CRONTAB (UTC — server must be UTC)
# IST = UTC+5:30, so 18:00 IST = 12:30 UTC, 19:30 IST = 14:00 UTC
# ═══════════════════════════════════════════════════════════════════════════
#
# # TradeOS — Daily pipeline (Mon-Fri 18:00 IST = 12:30 UTC)
# 30 12 * * 1-5 cd /path/to/backend && python run_pipeline.py >> logs/pipeline.log 2>&1
#
# # TradeOS — Performance tracking (Mon-Fri 20:30 IST = 15:00 UTC)
# 0 15 * * 1-5 cd /path/to/backend && python -c "from brain.performance_tracker import run_performance_tracking; run_performance_tracking()" >> logs/perf.log 2>&1
#
# # TradeOS — Brain full run (Sunday 19:30 IST = 14:00 UTC)
# 0 14 * * 0 cd /path/to/backend && python -m brain.brain_engine --mode full >> logs/brain.log 2>&1
#
# # TradeOS — Brain quant run (Wednesday 19:30 IST = 14:00 UTC)
# 0 14 * * 3 cd /path/to/backend && python -m brain.brain_engine --mode quant >> logs/brain.log 2>&1
#
# # TradeOS — Weekly Telegram digest (Sunday 20:00 IST = 14:30 UTC)
# 30 14 * * 0 cd /path/to/backend && python -c "from brain.performance_tracker import send_weekly_telegram_summary; send_weekly_telegram_summary()" >> logs/perf.log 2>&1
#
# # TradeOS — Script scanner (Saturday 10:00 IST = 04:30 UTC)
# 30 4 * * 6 cd /path/to/backend && python -c "from brain.script_scanner import run_scan; run_scan()" >> logs/brain.log 2>&1
